name: Build & Package Free Universal Remote APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Detect Project Structure & Ensure Gradle Wrapper JAR
        run: |
          echo "=== Listing Repository Root Files ==="
          ls -la

          # 1. Check if user committed files inside a subfolder (e.g. OmniRemote-Android-Source/)
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "settings.gradle.kts not found at root. Checking subdirectories..."
            SUBDIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo ">>> Detected project inside subfolder: $SUBDIR. Moving files to repository root..."
              shopt -s dotglob
              cp -r "$SUBDIR"/* . || true
              shopt -u dotglob
              ls -la
            fi
          fi

          # 2. Check if Android project files are actually present in repository
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::No Android project files found in this repository! Please upload the contents of OmniRemote-Android-Source.zip (including 'app' and 'settings.gradle.kts') to your repo."
            exit 1
          fi

          # 3. CRITICAL: Ensure gradle/wrapper/gradle-wrapper.jar exists!
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo ">>> gradle/wrapper/gradle-wrapper.jar is missing. Regenerating wrapper JAR..."
            mkdir -p gradle/wrapper
            gradle wrapper --gradle-version 8.4 --distribution-type bin || true
          fi

          # 4. Fallback download of wrapper jar if system gradle failed
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo ">>> Fetching official gradle-wrapper.jar directly..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

          # 5. Ensure gradlew is executable
          chmod +x gradlew || true

      - name: Prepare Android Signing Keystore
        run: |
          mkdir -p app/
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "No custom keystore provided. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=OmniRemote, OU=OpenSource, O=Omni, L=Local, S=LAN, C=US"
          else
            echo "Decoding custom signing keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/debug.keystore
          fi

      - name: Build Standalone APKs
        run: |
          if [ -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Building with Gradle Wrapper..."
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            echo "Building with system Gradle..."
            gradle assembleRelease assembleDebug --stacktrace
          fi
        env:
          KEYSTORE_PATH: "debug.keystore"
          KEYSTORE_PASSWORD: "android"
          KEY_ALIAS: "androiddebugkey"
          KEY_PASSWORD: "android"

      - name: Rename Artifacts for Distribution
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/release/app-release.apk output/OmniRemote-Universal-Release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk output/OmniRemote-Universal-Release.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk output/OmniRemote-Universal-Debug.apk || true

      - name: Upload Compilation Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: OmniRemote-Installable-APKs
          path: output/*.apk
          retention-days: 30

name: Build & Package Free Universal Remote APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Official Gradle 8.4 Engine
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Detect Project Structure
        run: |
          echo "=== Listing Repository Root Files ==="
          ls -la

          # 1. If user committed files inside a subfolder, move them to root
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "settings.gradle.kts not found at root. Checking subdirectories..."
            SUBDIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo ">>> Detected project inside subfolder: $SUBDIR. Moving files to repository root..."
              shopt -s dotglob
              cp -r "$SUBDIR"/* . || true
              shopt -u dotglob
              ls -la
            fi
          fi

          # 2. Verify Android files
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::No Android project files found! Please upload the contents of the zip file to your repo."
            exit 1
          fi

      - name: Prepare Android Signing Keystore
        run: |
          mkdir -p app/
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=OmniRemote, OU=OpenSource, O=Omni, L=Local, S=LAN, C=US"
          else
            echo "Decoding custom signing keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/debug.keystore
          fi

      - name: Build Standalone APKs
        run: gradle assembleRelease assembleDebug --stacktrace
        env:
          KEYSTORE_PATH: "debug.keystore"
          KEYSTORE_PASSWORD: "android"
          KEY_ALIAS: "androiddebugkey"
          KEY_PASSWORD: "android"

      - name: Rename Artifacts for Distribution
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/release/app-release.apk output/OmniRemote-Universal-Release.apk || cp app/build/outputs/apk/release/app-release-unsigned.apk output/OmniRemote-Universal-Release.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk output/OmniRemote-Universal-Debug.apk || true

      - name: Upload Compilation Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: OmniRemote-Installable-APKs
          path: output/*.apk
          retention-days: 30
